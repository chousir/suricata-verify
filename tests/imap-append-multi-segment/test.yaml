requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set outputs.6.file-store.enabled=yes

checks:
- filter:
    count: 1
    match:
      event_type: flow
      app_proto: imap
      flow.state: closed
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.filename: appendmsg
      fileinfo.size: 46
      fileinfo.state: CLOSED
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: 66880a4a0fcca2bdd84c1ef4fc755cb0cfc9d83b337dc0c612b944d8393034db
- filter:
    count: 1
    match:
      event_type: fileinfo
      not-has-key: [fileinfo.md5, fileinfo.sha1]
- filter:
    count: 0
    match:
      event_type: anomaly
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
