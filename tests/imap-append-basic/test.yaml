requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set outputs.6.file-store.enabled=yes

checks:
- filter:
    count: 1
    match:
      event_type: flow
      app_proto: imap
      flow.state: closed
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.filename: appendmsg
      fileinfo.size: 51
      fileinfo.state: CLOSED
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: f717015ffc9dac9caeb405ae007152c5371b25c14761217a753d612004d6987c
- filter:
    count: 1
    match:
      event_type: fileinfo
      not-has-key: [fileinfo.md5, fileinfo.sha1]
- filter:
    count: 0
    match:
      event_type: anomaly
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
