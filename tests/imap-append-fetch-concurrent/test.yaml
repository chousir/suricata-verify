requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set outputs.6.file-store.enabled=yes

checks:
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.tx_id: 1
      fileinfo.filename: rawmsg
      fileinfo.size: 19
      fileinfo.state: CLOSED
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: 3b662c44c84d3aaa98e9b20fa23e86e6b5c68020b09945e3c985c40bf1752ed4
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.tx_id: 2
      fileinfo.filename: appendmsg
      fileinfo.size: 8
      fileinfo.state: CLOSED
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: 3994e32df93d5c083d53b9eb6e8f4575974fba102b88f4150d0ce5c652d20c03
- filter:
    count: 2
    match:
      event_type: fileinfo
- filter:
    count: 2
    match:
      event_type: fileinfo
      not-has-key: [fileinfo.md5, fileinfo.sha1]
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
