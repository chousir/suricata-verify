requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set outputs.6.file-store.enabled=yes

checks:
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.tx_id: 1
      fileinfo.filename: appendmsg
      fileinfo.size: 32
      fileinfo.state: "TRUNCATED"
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: 61d03190ca8805675bf22e9f9760e6d1cde624b143939d503118b9b55d01bd67
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.tx_id: 2
      fileinfo.filename: appendmsg
      fileinfo.size: 64
      fileinfo.state: CLOSED
      fileinfo.gaps: false
      fileinfo.stored: true
      fileinfo.sha256: 23ba5b63d86f7341194c0f004e62049cbd6fb46807c19a2b80b5255263b3441c
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.tx_id: 2
      not-has-key: [fileinfo.md5, fileinfo.sha1]
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
