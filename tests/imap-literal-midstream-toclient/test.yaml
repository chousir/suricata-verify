requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set stream.midstream=true
- --set stream.midstream-policy=pass-flow

checks:
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.size: 16
      fileinfo.state: CLOSED
- filter:
    count: 0
    match:
      event_type: anomaly
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
