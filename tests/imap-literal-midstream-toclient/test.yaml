requires:
  min-version: 8

args:
- -k none
- --set app-layer.protocols.imap.enabled=yes
- --set stream.midstream=true
- --set outputs.6.file-store.enabled=yes

checks:
- filter:
    count: 1
    match:
      event_type: fileinfo
      fileinfo.size: 16
      fileinfo.state: CLOSED
      fileinfo.sha256: 295c324b03ae507d259019b94c8db2e4ac099eb8b2b84c9fa744b728f206e0d3
      fileinfo.stored: true
- filter:
    count: 1
    match:
      event_type: fileinfo
      not-has-key: [fileinfo.md5, fileinfo.sha1]
- filter:
    count: 0
    match:
      event_type: anomaly
- filter:
    count: 1
    match:
      event_type: stats
      stats.app_layer.error.imap.parser: 0
